<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Cursos</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; }
    h1 { margin-bottom: 1rem; }
    form { display: grid; gap: .75rem; padding: 1rem; border: 1px solid #d1d5db; border-radius: 8px; }
    label { display: grid; gap: .25rem; font-weight: 600; }
    input { padding: .5rem; border: 1px solid #9ca3af; border-radius: 6px; font-size: 1rem; }
    button { padding: .6rem 1rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    #msg { margin-top: .75rem; font-weight: 600; }
    .ok { color: #15803d; } .erro { color: #b91c1c; }
    a { display: inline-block; margin: 1.25rem 0 .75rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #d1d5db; padding: .5rem; text-align: left; }
    th { background: #f3f4f6; }
  </style>
</head>
<body>
  <h1>Cadastro de Cursos</h1>

  <form id="form">
    <label>Nome do curso <input name="nome" type="text" required></label>
    <label>Instrutor responsável <input name="instrutor" type="text" required></label>
    <label>Preço (R$) <input name="preco" type="number" step="0.01" min="0" required></label>
    <label>Quantidade de vagas <input name="vagas" type="number" step="1" min="0" required></label>
    <button type="submit">Cadastrar</button>
  </form>
  <div id="msg"></div>

  <a href="#" id="listar">Listar todos os cursos</a>
  <div id="lista"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
