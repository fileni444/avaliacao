#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

users:
  - name: ubuntu
    gecos: DevOps Lab
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_key}

ssh_pwauth: false
disable_root: true

package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - python3

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
