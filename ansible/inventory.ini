# Este arquivo é regenerado pelo "tofu apply" com os IPs reais.
# Se preferir preencher manualmente, troque os IPs abaixo.
[vm1]
vm1 ansible_host=IP_PUBLICO_VM1

[vm2]
vm2 ansible_host=IP_PUBLICO_VM2

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
