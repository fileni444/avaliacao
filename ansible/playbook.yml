---
# 1) VM2: API Node.js + MySQL (docker compose)
- name: Implantar API e banco na VM2
  hosts: vm2
  become: true
  gather_facts: false
  tasks:
    - name: Aguardar SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Aguardar o cloud-init terminar (Docker instalado)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Garantir Docker ativo
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Criar diretório da API
      ansible.builtin.file:
        path: /opt/api
        state: directory
        mode: "0755"

    - name: Copiar arquivos da API
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../api/"
        dest: /opt/api/

    - name: Configurar CORS com a origem da VM1
      ansible.builtin.copy:
        dest: /opt/api/.env
        content: |
          CORS_ORIGIN=http://{{ hostvars['vm1'].ansible_host }}
        mode: "0644"

    - name: Subir API e MySQL
      ansible.builtin.command: docker compose up -d --build
      args:
        chdir: /opt/api

    - name: Aguardar API responder na porta 3000
      ansible.builtin.uri:
        url: http://localhost:3000/cursos
        status_code: 200
      register: api_check
      retries: 30
      delay: 5
      until: api_check.status == 200

# 2) VM1: servidor web + HTML
- name: Implantar aplicação web na VM1
  hosts: vm1
  become: true
  gather_facts: false
  tasks:
    - name: Aguardar SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Aguardar o cloud-init terminar (Docker instalado)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Garantir Docker ativo
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Criar diretório da aplicação
      ansible.builtin.file:
        path: /opt/app
        state: directory
        mode: "0755"

    - name: Copiar arquivos da aplicação web
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/"
        dest: /opt/app/

    - name: Apontar o front-end para a API da VM2
      ansible.builtin.copy:
        dest: /opt/app/config.js
        content: |
          window.API_URL = "http://{{ hostvars['vm2'].ansible_host }}:3000";
        mode: "0644"

    - name: Construir imagem do servidor web
      ansible.builtin.command: docker build -t cursos-web:latest /opt/app

    - name: Remover contêiner antigo (se existir)
      ansible.builtin.command: docker rm -f cursos-web
      failed_when: false
      changed_when: false

    - name: Executar contêiner do servidor web
      ansible.builtin.command: >
        docker run -d --name cursos-web --restart always -p 80:80 cursos-web:latest

    - name: Verificar página
      ansible.builtin.uri:
        url: http://localhost/
        status_code: 200
